# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay
set -sg escape-time 0

# Enable extended key reporting (Kitty Keyboard Protocol passthrough)
set -g extended-keys on

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Clipboard on
set -g set-clipboard on

# Enable focus events for vim autoread
set -g focus-events on

# Allow OSC escape sequences to pass through to outer terminal
set -g allow-passthrough on

# Propagate pane title to outer terminal (Ghostty header)
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Renumber windows when one is closed
set -g renumber-windows on 

# Use vi keybindings in copy mode
set -g mode-keys vi

# ============================================
# KEY BINDINGS
# ============================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ============================================
# APPEARANCE
# ============================================

# Status bar position
# set -g status-position top
set -g status off

# Status bar colors
set -g status-style 'bg=default fg=default'
set -g status-left-length 20
set -g status-right-length 50
# Status bar content
set -g status-left ''
set -g status-right ''

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#d9d9d9,bold](#S) #W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'

# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install plugins:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# git clone https://github.com/tmux-plugins/tmux-sensible ~/.tmux/plugins/tmux-sensible
# git clone https://github.com/christoomey/vim-tmux-navigator ~/.tmux/plugins/vim-tmux-navigator
# git clone https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-strategy-nvim 'session'
set-hook -g session-created 'if-shell "[ $(tmux list-sessions | wc -l) -eq 1 ]" "run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh quiet"'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
